# ===== 知南·Echo · 一键部署 =====
# 用法：
#   cp backend/.env.example backend/.env && 填入 API Key（可选）
#   docker compose up -d --build
# 访问：http://服务器IP/      （nginx 托管前端 + 反代 API）
#
# 可选服务（报名表技术路线的生产配置）：
#   PostgreSQL / MinIO —— demo 阶段默认使用内置 SQLite + 本地文件存储，零外部依赖；
#   需要时取消下方注释，并在 .env 中设置 DATABASE_URL。

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: echo-backend
    restart: unless-stopped
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      # 切换 PostgreSQL 时取消注释：
      # - DATABASE_URL=postgresql+psycopg2://echo:echo@postgres:5432/echo
    volumes:
      - echo-data:/app/data
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: echo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # ---- 可选：生产数据库（与报名表技术路线一致）----
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: echo
  #     POSTGRES_PASSWORD: echo
  #     POSTGRES_DB: echo
  #   volumes:
  #     - echo-pg:/var/lib/postgresql/data

  # ---- 可选：对象存储（替代本地 uploads）----
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: echo
  #     MINIO_ROOT_PASSWORD: echo123456
  #   volumes:
  #     - echo-minio:/data

volumes:
  echo-data:
